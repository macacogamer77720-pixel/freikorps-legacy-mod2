l_english:
la_crisis_polaca:0 "la crisis polaca"
la_crisis_polaca_desc:0 "fue por alla en 1919 cuando tuvimos que ceder territorios por el tratado de versalles, entre ellos territorios al este de Prusia siendo el mas insulso y insultante de todos el territorio de Danzig, sin embargo eso se acabo, después de años por fin tenemos la oportunidad de recuperar Danzig y hasta incluso mas territorios."
trabajando_a_contra_reloj:0 "trabajando a contra reloj"
trabajando_a_contra_reloj_desc:0 "para que esto salga bien deberemos estirar las negociaciones hasta llegar a algo concreto, de lo contrario el imperio británico se hartara de nosotros y nos obligara a retactarnos "
estirando_las_negociasiones:0 "estirando las negociasiones"
enfriar_las_aguas:0 "enfriar las aguas"
enfriar_las_aguas_desc:0 "es de suma importancia que logremos enfriar la crisis y hacerla ver como mucho menos importante de lo que realmente es, no importa si para ello tendremos que comprar funcionarios, mentir o simplemente bajar las hostilidades temporalmente"
ofensiva_fronteriza_en_gdyna:0 "ofensiva fronteriza en Gdyna"
secure_the_baltic:0 "secure the baltic" 
secure_the_baltic_desc:0 "The Baltic states have been a point of tension between us and the West, but looking at the political landscape, perhaps we could take control of them if we invest sufficient resources. Besides, it would certainly be a great boost to the morale and loyalty of our troops. Our current influence is [?baltic_influence] we'll need at least 100 to stage a coup."
impatient_freikorps:0 "impatient freikorps" 
impatient_freikorps_desc:0 "The Freikorps have been dissatisfied with the results of recent years due to the government's poor handling of military expansion. However, with the new "hardline" government, they hope this will change. It is crucial, however, that we manage expectations carefully, as disappointing them could have unprecedented consequences. We have a loyalty of [?freikorps_loyalty] and need 100 to pacify them."


