historia_del_estado_aleman.1.t:0 "el estado aleman"
historia_del_estado_aleman.1.d:0 "El estado aleman es una entidad que es declarada en 1920 tras el golpe de estado hecho por wolf kapp y las unidades paramilitares “freikorps”\n"
historia_del_estado_aleman.1.a:0 "si honestamente no me interesa el lore"
historia_del_estado_aleman.1.b:0 "y como paso ese golpe de estado?"
historia_del_estado_aleman.2.t:0 "EL GOLPE DE ESTADO"
historia_del_estado_aleman.2.d:0 "la conspiración inicia con la sensación de escepticismo de la derecha hacia la república socialdemócrata, habido pasado por un intento de revolución en alemania por los llamados “espartaquistas”, siendo un intento de instaurar comunismo en la joven república, es así que el gobierno crea las unidades paramilitares conocidas como “freikorps” hechas de veteranos de la primera guerra mundial y por jóvenes anti-comunistas, estas unidades aplastaron la revuelta y matarían a los líderes rosa luxemburgo y …. Es así como estas unidades cobran un peso extremadamente importante para más tarde.\n\npara 1920 la derecha alemana todavía no se sentía ni quería estar cómodo con la idea de una democracia liberal sin mencionar claro el tratado de versalles que proponia cosas como reducir la fuerza del ejército a 100.000 cosa que claro a la derecha molesto demasiado, es por esto que organizaron un golpe de estado que no entraría en vigor hasta en el 29 de febrero de 1920, esto debido a que por las estipulaciones del tratado de versalles, el ejército se vio obligado a disolver una brigada de la marina y un cuerpo de voluntarios, debido a esto El 10 de marzo de 1920, el general Walther von Lüttwitz exigió del presidente Friedrich Ebert y del ministro de Defensa Gustav Noske que se dejará de reducir las tropas, que se disolviese el parlamento y que se eligiese el presidente directamente por el pueblo. Ebert y Noske rechazaron estas exigencias y le dieron vacaciones forzosas a von Lüttwitz. Entonces von Lüttwitz decidió llevar a cabo un golpe de Estado.\n\nel 13 de marzo Lüttwitz decidió partir con una brigada a berlín, el ejército regular se negó a combatir a los golpistas y como resultado Friedrich Ebert y Gustav se vieron forzados a huir, de manera que Wolfgang Kapp se nombró a sí mismo canciller y a von Lüttwitz ministro de Defensa y comandante en jefe del ejército es así como los funcionarios de berlín se negaron a acatar sus órdenes y llamaron a un paro general. Sin embargo debido a los comunistas todavia resentidos por los asesinatos de Rosa Luxemburgo llamaron a no hacer el paro.\n\nfue de esta manera que a pesar de que el paro fue en cierta parte efectivo los llamados del partido comunista a no hacer paros dificulto mucho su efectividad. De manera que con el pasar de los dias y dias, los paros fueran poco a poco perdiendo fuerza hasta que finalmente Wolfgang Kapp pudo finalmente cimentar su control sobre berlín y cuando el partido comunista se dio cuenta de su error fue demasiado tarde. rápidamente Wolfgang mando a banear al partido comunista y matar a todos los de este, la mayoría terminaria huyendo a hungria y después rusia y los que no terminaron masacrados por las unidades freikorps\n"
historia_del_estado_aleman.2.a:0 "interesante"
historia_del_estado_aleman.3.t:0 "primeros movimientos"
historia_del_estado_aleman.3.d:0 "apesar de que occidente miraba con cautela y preocupacion lo que estaba ocurriendo en eso no detendria a wolfgang de hacer movimientos, de manera que para sorpresa de muchos el se reuniria con diplomaticos de la rusia comunista para negociar un apoyo militar en la guerra conntra polonia a cambio de que alemania recuperara partes de su terriotorio perdido asi como una mantencion de la independencia de los estados balticos, apesar de que este movimiento fue muy mal visto por sectores mas radicales de su gobierno como el genenral ludendorf, sin embargo esto seria vistos con ojos de terror por parte de la entente, ya que podia significar no solamente una posible alianza entre los dos estados, sino que ademas podria significar que alemania se negara a pagar las reparaciones de guerra, cosa que facilmente podria significar una invasioon por parte de inglaterra y francia, pero apesar de esto wolfgang sorprendio a todos al aceptar gran parte de las demandas de reparaciones de guerra tambien de acpeptar el tratado de versalles, solamente pidiendo como requisito la posibilidad de negociar de manera moderada ciertas cosas. De esa manera se renegociaria el tratado de versalles, consiguiendo que el ejercito se pudiera expandir hasta 500.000 hombres, que los freikorps se mantuvieran como fuerza paramilitar legal y que las reparaciones se alivianaran un poco. claro que esto no seria bien resivido por el ala mas conservadora de su gobierno,cosa que tendria consecuencias devastadoras "
historia_del_estado_aleman.3.a:0 "quiero volver atrás"
historia_del_estado_aleman.3.b:0 "interesante"
historia_del_estado_aleman.3.t:0 "intento de golpe de estado y normalizacion"
historia_del_estado_aleman.3.d:0 " a pesar de que el gobierno de wolfgang se mantuvo relativamente estable en los siguientes años las cosas tomarian un giro drastico en 1922 con la muerte de kamppf, esto no seria desaprovechado por ludendorf y el ala conservadora que se negaba a acpetar el gobierno de continuidad de luttwitz, de manera que en la primavera de 1923, ludendorf y su sequito intentarian hacer un contra-golpe de estado, sin embargo el resultado quedo inconcluso, ya que durante los primeros dias ludendorf no fue capas de neutralizar a los lideres del ruling goverment por lo que seguiria en esos dias seria un caos absoluto, obreros tomando las calles, peleas entre las propias freikops y casi nula comunicacion, por lo que al ver lo que estaba pasando, ludendorf decidio abandonar el golpe y tratar de evitar una guerra civil o la llegada de ideas comunistas al poder, sin embargo los metodos para socabar las protestas que ludendorf y sus unidades hicieron fueron tan extremas que se le conoce como ¿"la masacre hamburgo" donde se dio ordenes de disparar a matar a cualquiera que protestara en las calles, ludendorf no solo no se disculpo nunca sino que dijo su famosa frase "lo haria una y mil veces mas de ser necesario". Apesar de el golpe de estado haber fracasado, esto no significo la muerte del ala de linea dura, debido al respeto y aprecio que tenian los oficiales a ludendorf, luttwitz sabia que apresar o siquiera obligar al retiro a ludendorf seria un movimiento demaciado arriesgado asique se centro principalmente en contener su posible influencia politica. Aunque esto sin duda fue algo que el gobierno no deseaba tuvo tambien su lado positivo, con los radicales ya agotados politicamente, luttwitz decide aprovechar la oportunidad para hacer un tratado economico con la urss que le permitiria a alemania no solo pagar sus deudas de guerra y sacarla de la crisis sino que ademas romper su aislamiento tanto economico como diplomatico, siendo sin duda un movimiento que le daria un respiro enorme al todavia joven estado aleman"
historia_del_estado_aleman.3.a:0 "quiero volver atrás"
historia_del_estado_aleman.3.b:0 "interesante"
historia_del_estado_aleman.4.t:0 "consolidacion y disputas 1925-1929"
historia_del_estado_aleman.4.d:0 " despues de esos años tan turbulentos, el estado aleman porfin habia encontrado una estabilidad notable, con una economia que se recuperaba y una situacion diplomatica mucho mas estable, con una poblacion que con el pasar de los años parecia despolitisarse y adaptarse a la nueva era, parecia que el sueño "la alemania de soldados, intelectuales y musicos" habia vuelto, sin embargo apesar de esto, el regimen provaria tener problemas a largo plazo, apesar de haber sido mas pragmatico el regimen de luttwitz seguia invirtiendo muchos recursos y atencion en el ejercito para algun dia tomar venganza de la derrota de la gran guerra, lo que no es raro que despues de mas de 10 años haya desgastado la economia en gran parte, por no mencionar que el tratado con la urss apesar de ser muy positivo habia vuelto a alemania dependiente economicamente a la union sovietica, por lo que la urss sin ser tonta depues de tanto tiempo se a dado cuenta de que alemania necesita mas a ellos que ellos a alemania, por lo que ha empezado a exigir cada vez mas cosas y en mayor cantidad, cosa que se a notado en la calidad de vida, el piño de ludendorf a hablado que lo que se necesita hacer es bajar o inlcuso detener completamente los tratos economicos con la urss, en favor de la autarquia y el desarrollo de la industria nacional. Ademas de que en respuesta a este movimiento un nuevo hombre a cogido fuerza entre los freikorps de clase baja y media que habla de que no solamente las relaciones con la urss deben seguir sino que ademas se deben expandir todo lo posible, este hombre es Ernst Röhm, alguien que dice hablar por los freikorps populares y que el verdadero nacionalismo no es el de la aristocracia que no les podrian importar menos, sino en los trabajadores pintores soladados y campesinos que son los verdaderos alemanes, naturalmente este mismo a entrado en conflicto con ludendorf y su ala conservadora radical puesto que uno representa a los freikorps de clase baja y media mientras que el otro representa a los oficiales que buscan el la obediencia total de estos mismos. El regimen para 1936 se encuentra con una situacion francamente mediocre, luttwitz ya esta cansado de tener tanto tiempo el poder y esta planeando su retiro, pero no tiene un sucesor claro, por lo que es de esperarse que todos los posibles candidatos estan como vuiltres esperando, sera ludendorf el sucesor? sera rohm? o sera otra persona del area pragmatica que tenga capas una mente mas habierta? pues esta por verse "
historia_del_estado_aleman.4.a:0 "quiero volver atras"
historia_del_estado_aleman.4.b:0 "POR EL REICH"
historia_del_estado_aleman.5.t:0 "the knight of reaction"
historia_del_estado_aleman.5.d:0 "Someone enters the room to tell Ludendorf, a member of the military junta, that Alfred Hugenberg is preparing a reformist candidacy, sensing that Lutwitz's regime is about to end due to his old age and the state of the nation. He enters and is surprised to hear Beethoven playing and the sound of a wine glass being poured. He sees Ludendorf in his most flamboyant and understated military uniform, stuffing himself with ribs and roast potatoes. The man is taken aback and says, "Hello." "What brings you here?" Ludendorf asks in a disagreeable tone. The man begins to explain in a convoluted way, given the disgusting sight of Ludendorf eating. However, when he mentions the reformist faction's candidacy, Hugenberg falls silent and begins to speak in an arrogant manner. \n\"So the bastard is really going to do it..." he says in a contemptuous tone. "That bookworm thinks he's the best alternative for Germany, that we need 'change,' that our regime is unsustainable..." “Well, I’ll tell that hypocrite who years ago was badmouthing the republic that this is sustainable and all it takes is a firmer hand, it’s that simple.” At this point, the informant didn’t know whether to leave (which would surely be seen as disrespectful to someone like him) or stay and listen to the speech of someone clearly stuck in the 19th century.\n\ “The worst part… is that they don’t know how to love Germany the way I do. They only want things like ‘the language,’ ‘the food,’ ‘brotherhood,’ but I say no, the real Germany is made up of soldiers, farmers, and true intellectuals, not those pathetic social democrats or like Hugenberg himself. You really don’t know how sick all this-” Just as he was about to finish the sentence, he realized the messenger was gone and he was talking to himself."
historia_del_estado_aleman.5.a:0 ""It seems I'll have a lot to teach them when I take power.""
